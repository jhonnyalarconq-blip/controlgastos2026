<div class=card style="grid-column:1/-1"><h3>Bancos y cuentas</h3><p class=mu style="margin-bottom:10px">Marca qué cuenta cumple cada función. Los bancos que no sean principales salen en el botón "Otros".</p>${[['bPrin','Bancos principales','botones directos; suman al dinero disponible'],['bAho','Bancos de ahorritos','suman a Ahorritos'],['bPlan','Bancos para planificar','su saldo es el disponible del Planificador']].map(x=>`<div class=fl>${x[1]} <span class=mu>· ${x[2]}</span></div><div class=chips>${B().map(b=>`<button class="btn xs ${(D.cfg[x[0]]||[]).includes(b)?'':'s'}" onclick="cfgTog('${x[0]}','${b}')">${b}</button>`).join('')}</div>`).join('')}<div class=fl>Bancos secundarios <span class=mu>· salen en "Otros"</span></div><p>${B().filter(b=>!PR().includes(b)).join(', ')||'Ninguno'}</p></div><div class=sh style="grid-column:1/-1">Listas</div>${L('bancos','Bancos y cuentas')}${L('personas','Personas / relaciones')}${L('rubros','Clientes / rubros de trabajitos')}${L('tiposIng','Tipos de ingreso')}${L('feriados','Feriados (el cobro retrocede si cae domingo o feriado)')}
<div class=sh style="grid-column:1/-1">Respaldo y conexión</div><div class=card><h3>Respaldo</h3><p class=mu style="margin-bottom:8px">Copia tus datos o restáuralos desde un respaldo.</p><button class="btn s" onclick="navigator.clipboard.writeText(JSON.stringify(D));alert('Copiado')">Copiar respaldo JSON</button> <button class="btn s" onclick="rest()">Restaurar respaldo</button></div><details class=card style="grid-column:1/-1" ${S.op.sy?'open':''} ontoggle="S.op.sy=this.open"><summary style="cursor:pointer;font-weight:700">Sincronización con Google Sheets <span class=mu id=sysT></span></summary>

<div class=chips style="margin-top:12px"><button class=btn onclick=conectar()>Guardar y conectar</button><button class="btn s" onclick=sincronizar()>Sincronizar ahora</button><button class="btn s" onclick=desconectar()>Desconectar</button></div>
<p class=mu style="margin-top:8px">Cada cambio se sube solo. Al volver a esta pestaña se baja lo más nuevo. Si dos dispositivos cambian lo mismo, la app te pregunta cuál conservar.</p></details>
<div class=sh style="grid-column:1/-1">Zona de peligro</div><div class=card style="grid-column:1/-1;border:2px solid var(--bad);background:#fef2f2"><h3 class=bad>Zona de peligro</h3><p class=mu style="margin-bottom:10px">Borra todos tus datos de este dispositivo y vuelve al ejemplo. Si tienes Google Sheets conectado, también reemplazará lo de la nube. No se puede deshacer.</p><button class="btn d" onclick="if(confirm('¿Seguro? Se borrarán TODOS los datos de este dispositivo.')&&confirm('Última confirmación: no se puede deshacer.')){localStorage.removeItem(KEY);load();genMes(today().slice(0,7));go()}">Restablecer ejemplo</button></div></div>`}
function rest(){const t=prompt('Pega aquí el respaldo JSON');if(!t)return;try{const o=JSON.parse(t);if(!o.cfg||!o.ingresos)throw 0;if(!confirm('Esto reemplaza todos los datos actuales. ¿Continuar?'))return;D=o;fix();save();genMes(today().slice(0,7));go();toast('Respaldo restaurado')}catch(e){alert('Ese texto no es un respaldo válido')}}
function ad(k){const v=prompt('Nuevo valor'+(k=='feriados'?' (AAAA-MM-DD)':''));if(v){D.cfg[k].push(v.trim());save();go()}}
function rm(k,i){if(confirm('¿Quitar "'+D.cfg[k][i]+'"?')){D.cfg[k].splice(i,1);save();go()}}
/* ===== navegación ===== */
const st2=(k,o)=>`<div class=tabs style="margin-bottom:12px">${o.map(x=>`<button class="${(S[k]||o[0][0])==x[0]?'on':''}" onclick="S['${k}']='${x[0]}';go()">${x[1]}</button>`).join('')}</div>`;

function go(v){const ch=v&&v!=S.view;if(v)S.view=v;const n=NAV.find(x=>x[0]==S.view);$('#ttl').textContent=n[2];$('#burger').innerHTML=ic('menu',20);$('#bcfg').innerHTML=ic('sliders',18);$('#blk').innerHTML=ic('lock',18);
const ms=[...new Set([today().slice(0,7),S.mes,...[...D.egresos,...D.ingresos,...D.gastos].map(x=>mesDe(x.f||x.venc))])].sort().reverse();
$('#mes').innerHTML='<option value=all>Todos</option>'+ms.map(m=>`<option value="${m}" ${m==S.mes?'selected':''}>${lbl(m)}</option>`).join('');
$('#side').innerHTML='<h1>Control de gastos<br>Jhonny</h1>'+NAV.map(x=>`<button class="${x[0]==S.view?'on':''}" onclick="go('${x[0]}');side.classList.remove('o')"><span>${ic(x[1],18)}</span>${x[2]}</button>`).join('');
$('#bn').innerHTML=[['inicio','ant','Hormiga'],['est','bank','Estado'],['ing','wallet','Ingresos'],['plan','cal','Plan'],['egresos','receipt','Egresos']].map(x=>`<button class="${x[0]==S.view?'on':''}" onclick="go('${x[0]}')">${ic(x[1],22)}${x[2]}</button>`).join('')+`<button onclick="side.classList.toggle('o')">${ic('menu',22)}Más</button>`;
$('#v').innerHTML=n[3]();if(ch)$('#v').scrollTop=0;paintSy()}

function unlock(){if($('#pin').value===D.cfg.pin)$('#lock').classList.remove('o');else $('#pin').value=''}
const side=$('#side'),M=$('#M');load();genMes(today().slice(0,7));if(D.cfg.pin)$('#lock').classList.add('o');go();if(SY.url)pull(false);
